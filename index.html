<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"> <!-- Added Google Fonts for 'Great Vibes' -->
    <title>Wedding Invitation</title>
    <style>
        .seal {
            font-family: 'Great Vibes', cursive; /* Updated seal font */
        }
        /* Updated envelope styling to match reference image */
        .envelope {
            background: linear-gradient(to bottom, #e5e5e5, #ffffff);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        .clickable-label {
            visibility: hidden;
            font-size: 12px;
        }
        .seal:hover .clickable-label {
            visibility: visible; /* Show label on hover */
        }
    </style>
</head>
<body>
    <div class="envelope">
        <div class="seal" onclick="openInvitation()">
            <span>A&I</span> <!-- Seal updated to display "A&I" -->
            <span class="clickable-label">Click to open</span> <!-- Subtle text label added -->
        </div>
    </div>
    <script>
        function openInvitation() {
            // Logic to open invitation goes here
        }
        // Removed onclick from .envelope div; only seal triggers openInvitation
    </script>
</body>
</html>
