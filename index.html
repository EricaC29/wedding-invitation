!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<style>

body{
margin:0;
background:#eae4d8;
font-family:Georgia,serif;
overflow:hidden;
}

/* plic full screen */

.envelope{
position:fixed;
width:100%;
height:100vh;
background:#dfe3c8;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
cursor:pointer;
}

/* model floral ca in video */

.envelope::before{
content:"";
position:absolute;
inset:0;
background-image:url("https://www.transparenttextures.com/patterns/floral-white.png");
opacity:0.35;
}

/* clapeta */

.flap{
position:absolute;
top:0;
width:100%;
height:45vh;
background:#cfd7a6;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
}

/* sigiliu */

.seal{
position:relative;
width:120px;
height:120px;
border-radius:50%;
background:#c94242;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:48px;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
z-index:2;
}

.text{
position:relative;
margin-top:30px;
font-size:28px;
color:#222;
z-index:2;
}

/* invitația */

.invite{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:white;
display:none;
overflow:auto;
padding:40px;
box-sizing:border-box;
}

input,textarea{
width:100%;
padding:10px;
margin-top:6px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:15px;
width:100%;
background:#c94242;
border:none;
color:white;
font-size:18px;
border-radius:8px;
}

</style>
</head>

<body>

<div class="envelope" onclick="openInvite()">

<div class="flap" id="flap"></div>

<div class="seal">A</div>

<div class="text">You are invited</div>

</div>

<div class="invite" id="invite">

<h2>RSVP</h2>

<label>Nume complet</label>
<input type="text">

<label>Număr de telefon</label>
<input type="text">

<h3>Veți fi însoțit(ă)?</h3>

<input type="radio" name="plus"> Da  
<input type="radio" name="plus"> Nu

<label>Numele însoțitorului</label>
<input type="text">

<h3>Confirmare participare</h3>

<b>12 septembrie 2026 - The Wedding</b><br>

<input type="radio" name="wedding"> Cu drag vom fi prezenți  
<input type="radio" name="wedding"> Din păcate nu putem ajunge

<br><br>

<b>13 septembrie 2026 - Brunch Party</b><br>

<input type="radio" name="brunch"> Cu drag vom fi prezenți  
<input type="radio" name="brunch"> Din păcate nu putem ajunge

<label>Preferințe alimentare</label>
<textarea></textarea>

<button>Confirmă prezența</button>

</div>

<script>

function openInvite(){

document.getElementById("flap").style.transform="rotateX(180deg)";

setTimeout(()=>{
document.querySelector(".envelope").style.display="none";
document.getElementById("invite").style.display="block";
},700);

}

</script>

</body>
</html>
