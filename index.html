<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%);
            font-family: 'Garamond', 'Georgia', serif;
            overflow: hidden;
            min-height: 100vh;
        }

        /* ENVELOPE SCREEN */
        .envelope-container {
            position: fixed;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%);
        }

        .envelope {
            position: relative;
            width: 90%;
            max-width: 500px;
            height: 600px;
            background: linear-gradient(to bottom, #fffbf5 0%, #f9f3e8 100%);
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            cursor: pointer;
        }

        /* Floral pattern background */
        .envelope::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='15' fill='%23d4c5a9' opacity='0.1'/%3E%3Ccircle cx='70' cy='50' r='12' fill='%23c9b8a0' opacity='0.12'/%3E%3Ccircle cx='50' cy='80' r='10' fill='%23d4c5a9' opacity='0.1'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        /* Envelope flap */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, #e8dcc8, #dfd2b8);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 0.8s ease-out;
            z-index: 10;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.5);
        }

        .flap.opened {
            transform: rotateX(180deg);
        }

        /* Wax seal */
        .seal {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #e85a5a, #c94242);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: #fff;
            box-shadow: 0 15px 35px rgba(201, 66, 66, 0.4), 
                        inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                        inset 2px 2px 5px rgba(255, 255, 255, 0.2);
            z-index: 5;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Garamond', serif;
        }

        .seal:hover {
            box-shadow: 0 18px 40px rgba(201, 66, 66, 0.5), 
                        inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                        inset 2px 2px 5px rgba(255, 255, 255, 0.2);
        }

        /* Invitation text */
        .invite-text {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-style: italic;
            color: #2a2a2a;
            z-index: 3;
            text-align: center;
            font-family: 'Garamond', serif;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* RSVP FORM SCREEN */
        .rsvp-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #fffbf5 0%, #f9f3e8 100%);
            display: none;
            overflow-y: auto;
            padding: 20px;
            z-index: 100;
        }

        .rsvp-container.show {
            display: block;
        }

        .rsvp-content {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(255, 251, 245, 0.95);
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .rsvp-content h1 {
            text-align: center;
            font-size: 42px;
            color: #2a2a2a;
            margin-bottom: 40px;
            font-family: 'Garamond', serif;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .form-section {
            margin-bottom: 35px;
        }

        .form-section label {
            display: block;
            font-size: 16px;
            color: #2a2a2a;
            margin-bottom: 8px;
            font-family: 'Garamond', serif;
            font-weight: 500;
        }

        .form-section h3 {
            font-size: 18px;
            color: #2a2a2a;
            margin-bottom: 15px;
            font-family: 'Garamond', serif;
            font-weight: 500;
            text-decoration: underline;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4c5a9;
            border-radius: 6px;
            font-family: 'Garamond', serif;
            font-size: 15px;
            background: #fffbf5;
            color: #2a2a2a;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #c94242;
            box-shadow: 0 0 10px rgba(201, 66, 66, 0.2);
            background: #ffffff;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #b8a89a;
        }

        /* Radio buttons styling */
        .radio-group {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            cursor: pointer;
            font-size: 15px;
        }

        input[type="radio"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #c94242;
        }

        .event-block {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e0d5c7;
        }

        .event-block:last-of-type {
            border-bottom: none;
        }

        .event-date {
            font-size: 16px;
            font-weight: 600;
            color: #2a2a2a;
            margin-bottom: 12px;
            font-family: 'Garamond', serif;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d35353, #c94242);
            border: none;
            color: white;
            font-size: 18px;
            font-family: 'Garamond', serif;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 20px;
            box-shadow: 0 10px 25px rgba(201, 66, 66, 0.25);
        }

        button:hover {
            background: linear-gradient(135deg, #e85a5a, #d35353);
            box-shadow: 0 15px 35px rgba(201, 66, 66, 0.35);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #c94242;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(201, 66, 66, 0.3);
            z-index: 101;
        }

        .close-btn:hover {
            background: #d35353;
        }

        /* Conditional fields */
        .conditional {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f5f1e8;
            border-radius: 6px;
        }

        .conditional.show {
            display: block;
        }

        /* Success message */
        .success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 102;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease;
        }

        .success-message.show {
            display: block;
        }

        .success-message h2 {
            color: #c94242;
            font-size: 28px;
            margin-bottom: 15px;
            font-family: 'Garamond', serif;
        }

        .success-message p {
            color: #2a2a2a;
            font-size: 16px;
            font-family: 'Garamond', serif;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        @media (max-width: 600px) {
            .rsvp-content {
                padding: 30px 20px;
            }

            .rsvp-content h1 {
                font-size: 32px;
            }

            .radio-group {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <!-- ENVELOPE SCREEN -->
    <div class="envelope-container" id="envelopeContainer">
        <div class="envelope" onclick="openInvitation()">
            <div class="flap" id="flap"></div>
            <div class="seal" onclick="event.stopPropagation()">A</div>
            <div class="invite-text">You are invited</div>
        </div>
    </div>

    <!-- RSVP FORM SCREEN -->
    <div class="rsvp-container" id="rsvpContainer">
        <button class="close-btn" onclick="closeInvitation()">&times;</button>
        
        <div class="rsvp-content">
            <h1>RSVP</h1>
            <form id="rsvpForm">
                <!-- Full Name -->
                <div class="form-section">
                    <label for="fullName">Nume complet</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Introduceți numele" required>
                </div>

                <!-- Phone Number -->
                <div class="form-section">
                    <label for="phone">Număr de telefon</label>
                    <input type="text" id="phone" name="phone" placeholder="Introduceți numărul" required>
                </div>

                <!-- Plus One Question -->
                <div class="form-section">
                    <h3>Veți fi însoțit(ă)?</h3>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="plusOne" value="da" onchange="toggleCompanion(true)">
                            Da
                        </label>
                        <label>
                            <input type="radio" name="plusOne" value="nu" onchange="toggleCompanion(false)">
                            Nu
                        </label>
                    </div>
                </div>

                <!-- Companion Name (Conditional) -->
                <div class="conditional" id="companionField">
                    <label for="companionName">Numele însoțitorului</label>
                    <input type="text" id="companionName" name="companionName" placeholder="Introduceți numele însoțitorului">
                </div>

                <!-- Wedding Confirmation -->
                <div class="form-section">
                    <h3>Confirmare participare</h3>
                    
                    <div class="event-block">
                        <div class="event-date">12 septembrie 2026 - The Wedding</div>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="wedding" value="yes">
                                Cu drag vom fi prezenți
                            </label>
                            <label>
                                <input type="radio" name="wedding" value="no">
                                Din păcate nu putem ajunge
                            </label>
                        </div>
                    </div>

                    <div class="event-block">
                        <div class="event-date">13 septembrie 2026 - Brunch Party</div>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="brunch" value="yes">
                                Cu drag vom fi prezenți
                            </label>
                            <label>
                                <input type="radio" name="brunch" value="no">
                                Din păcate nu putem ajunge
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Dietary Preferences -->
                <div class="form-section">
                    <label for="dietary">Preferințe alimentare</label>
                    <textarea id="dietary" name="dietary" placeholder="Vă rugăm să ne comunicați eventualele alergii sau restricții"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit">Confirmă prezența</button>
            </form>
        </div>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="successMessage">
        <h2>✓ Mulțumim!</h2>
        <p>Răspunsul dumneavoastră a fost înregistrat.</p>
    </div>

    <script>
        // Open invitation
        function openInvitation() {
            const flap = document.getElementById('flap');
            const envelope = document.querySelector('.envelope');
            const envelopeContainer = document.getElementById('envelopeContainer');
            const rsvpContainer = document.getElementById('rsvpContainer');

            flap.classList.add('opened');

            setTimeout(() => {
                envelopeContainer.style.display = 'none';
                rsvpContainer.classList.add('show');
            }, 800);
        }

        // Close invitation
        function closeInvitation() {
            const envelopeContainer = document.getElementById('envelopeContainer');
            const rsvpContainer = document.getElementById('rsvpContainer');
            const flap = document.getElementById('flap');

            rsvpContainer.classList.remove('show');
            flap.classList.remove('opened');

            setTimeout(() => {
                envelopeContainer.style.display = 'flex';
            }, 300);
        }

        // Toggle companion field
        function toggleCompanion(show) {
            const companionField = document.getElementById('companionField');
            if (show) {
                companionField.classList.add('show');
            } else {
                companionField.classList.remove('show');
                document.getElementById('companionName').value = '';
            }
        }

        // Handle form submission
        document.getElementById('rsvpForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Collect form data
            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                plusOne: document.querySelector('input[name="plusOne"]:checked')?.value,
                companionName: document.getElementById('companionName').value,
                wedding: document.querySelector('input[name="wedding"]:checked')?.value,
                brunch: document.querySelector('input[name="brunch"]:checked')?.value,
                dietary: document.getElementById('dietary').value,
                timestamp: new Date().toISOString()
            };

            // Save to localStorage
            const responses = JSON.parse(localStorage.getItem('weddingRsvps') || '[]');
            responses.push(formData);
            localStorage.setItem('weddingRsvps', JSON.stringify(responses));

            // Send to server (if you have a backend)
            // fetch('/api/rsvp', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(formData)
            // });

            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('show');

            setTimeout(() => {
                successMessage.classList.remove('show');
                closeInvitation();
                document.getElementById('rsvpForm').reset();
                document.getElementById('companionField').classList.remove('show');
            }, 2000);
        });

        // Log all responses (for debugging/viewing wedding organizer)
        function viewAllResponses() {
            const responses = JSON.parse(localStorage.getItem('weddingRsvps') || '[]');
            console.log('Wedding RSVP Responses:', responses);
            return responses;
        }
    </script>
</body>
</html>
